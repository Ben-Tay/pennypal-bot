name: keepalive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping PennyPal to keep the Render instance warm
        shell: bash
        run: curl --fail --silent --show-error --output /dev/null https://pennypal-bot.onrender.com/